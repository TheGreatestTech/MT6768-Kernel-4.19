name: Build Zyte Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Get Build Date
        id: date
        run: echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add Swap Space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain
          key: clang-r450784e-v3

      - name: Download Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Clang not found in cache, downloading..."
          mkdir -p ${{ github.workspace }}/toolchain/clang-r450784e
          cd ${{ github.workspace }}/toolchain/clang-r450784e
          curl -fL -o clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Set Toolchain Path
        run: echo "CLANG_PATH=${{ github.workspace }}/toolchain/clang-r450784e/bin" >> $GITHUB_ENV

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zyte-kernel-all-variants
          max-size: 3G

      # =====================================================================
      # BUILD 1: BASE KERNEL
      # =====================================================================
      - name: Build Base Kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          mkdir -p releases
          
          echo "Generating base config..."
          make ARCH=arm64 O=out vendor/mt6768_defconfig
          cat arch/arm64/configs/vendor/selene.config >> out/.config
          yes "" | make ARCH=arm64 O=out olddefconfig
          
          export LOCALVERSION="-Zyte-base-${BUILD_DATE}"
          echo "Compiling Base Kernel with version: $LOCALVERSION"
          
          make ARCH=arm64 O=out -j$(nproc) CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LOCALVERSION="$LOCALVERSION"
          
          echo "Packaging Base..."
          rm -f Zyte-Kernel/Image.gz* Zyte-Kernel/dtb
          cp out/arch/arm64/boot/Image.gz-dtb Zyte-Kernel/ || cp out/arch/arm64/boot/Image.gz Zyte-Kernel/
          cp out/arch/arm64/boot/dts/mediatek/mt6768.dtb Zyte-Kernel/dtb
          
          cd Zyte-Kernel
          zip -r9 "../releases/Zyte-Kernel-base-${BUILD_DATE}.zip" *
          cd ..

      # =====================================================================
      # BUILD 2: KERNELSU NEXT ONLY
      # =====================================================================
      - name: Integrate KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "Applying core KSU Next manual hooks..."
          patch -p1 --forward --batch < patches/KernelSU-Next-Manual-Hook-4.19.patch

      - name: Build KSUN Kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          KSUN_VER=$(git -C KernelSU-Next rev-parse --short HEAD)
          
          echo "Generating KSUN config..."
          make ARCH=arm64 O=out vendor/mt6768_defconfig
          cat arch/arm64/configs/vendor/selene.config >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> out/.config
          yes "" | make ARCH=arm64 O=out olddefconfig
          
          export LOCALVERSION="-Zyte-KSUN-${KSUN_VER}-${BUILD_DATE}"
          echo "Compiling KSUN Kernel with version: $LOCALVERSION"
          
          make ARCH=arm64 O=out -j$(nproc) CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LOCALVERSION="$LOCALVERSION"
          
          rm -f Zyte-Kernel/Image.gz* Zyte-Kernel/dtb
          cp out/arch/arm64/boot/Image.gz-dtb Zyte-Kernel/ || cp out/arch/arm64/boot/Image.gz Zyte-Kernel/
          cp out/arch/arm64/boot/dts/mediatek/mt6768.dtb Zyte-Kernel/dtb
          
          cd Zyte-Kernel
          zip -r9 "../releases/Zyte-Kernel-KernelSU-Next-${KSUN_VER}-${BUILD_DATE}.zip" *
          cd ..

      # =====================================================================
      # BUILD 3: KERNELSU NEXT + SUSFS
      # =====================================================================
      - name: Integrate SUSFS
        run: |
          echo "Patching KernelSU-Next with SUSFS support..."
          cd KernelSU-Next
          patch -p1 --forward --batch < ../patches/KernelSU-Next-SUSFS-Patches.patch
          cd ..
          
          echo "Applying Core SUSFS 2.3.0..."
          patch -p1 --forward --batch < patches/SUSFS-DeInlined-v2.3.0.patch

      - name: Build KSUN + SUSFS Kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          KSUN_VER=$(git -C KernelSU-Next rev-parse --short HEAD)
          
          echo "Generating KSUN + SUSFS config..."
          make ARCH=arm64 O=out vendor/mt6768_defconfig
          cat arch/arm64/configs/vendor/selene.config >> out/.config
          
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> out/.config
          
          echo "CONFIG_KSU_SUSFS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> out/.config
          echo "# CONFIG_KSU_SUSFS_ENABLE_LOG is not set" >> out/.config
          
          yes "" | make ARCH=arm64 O=out olddefconfig
          
          export LOCALVERSION="-Zyte-SUSFS-${KSUN_VER}-${BUILD_DATE}"
          echo "Compiling KSUN + SUSFS Kernel..."
          
          make ARCH=arm64 O=out -j$(nproc) CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LOCALVERSION="$LOCALVERSION"
          
          rm -f Zyte-Kernel/Image.gz* Zyte-Kernel/dtb
          cp out/arch/arm64/boot/Image.gz-dtb Zyte-Kernel/ || cp out/arch/arm64/boot/Image.gz Zyte-Kernel/
          cp out/arch/arm64/boot/dts/mediatek/mt6768.dtb Zyte-Kernel/dtb
          
          cd Zyte-Kernel
          zip -r9 "../releases/Zyte-Kernel-KernelSU-Next-SUSFS-${KSUN_VER}-${BUILD_DATE}.zip" *
          cd ..

      # =====================================================================
      # BUILD 4: KERNELSU NEXT + NOMOUNT (NO SUSFS)
      # =====================================================================
      - name: Revert SUSFS for NoMount Build
        run: |
          echo "Reverting SUSFS patches from kernel and KSU-Next..."
          git checkout -- .
          git -C KernelSU-Next checkout -- .
          
          echo "Re-applying KSU Manual Hooks..."
          patch -p1 --forward --batch < patches/KernelSU-Next-Manual-Hook-4.19.patch
          
          echo "Integrating NoMount..."
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

      - name: Build KSUN + NoMount Kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          KSUN_VER=$(git -C KernelSU-Next rev-parse --short HEAD)
          NOMOUNT_VER=$(git -C NoMount rev-parse --short HEAD)
          
          echo "Generating KSUN + NoMount config..."
          make ARCH=arm64 O=out vendor/mt6768_defconfig
          cat arch/arm64/configs/vendor/selene.config >> out/.config
          
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> out/.config
          echo "CONFIG_NOMOUNT=y" >> out/.config
          
          yes "" | make ARCH=arm64 O=out olddefconfig
          
          export LOCALVERSION="-Zyte-NoMount-${NOMOUNT_VER}-${BUILD_DATE}"
          echo "Compiling KSUN + NoMount Kernel..."
          
          make ARCH=arm64 O=out -j$(nproc) CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LOCALVERSION="$LOCALVERSION"
          
          rm -f Zyte-Kernel/Image.gz* Zyte-Kernel/dtb
          cp out/arch/arm64/boot/Image.gz-dtb Zyte-Kernel/ || cp out/arch/arm64/boot/Image.gz Zyte-Kernel/
          cp out/arch/arm64/boot/dts/mediatek/mt6768.dtb Zyte-Kernel/dtb
          
          cd Zyte-Kernel
          zip -r9 "../releases/Zyte-Kernel-KernelSU-Next-NoMount-${NOMOUNT_VER}-${BUILD_DATE}.zip" *
          cd ..

      # =====================================================================
      # BUILD 5: KERNELSU NEXT + SUSFS + NOMOUNT (ULTIMATE)
      # =====================================================================
      - name: Apply SUSFS on top of NoMount
        run: |
          echo "Patching KernelSU-Next with SUSFS support..."
          cd KernelSU-Next
          patch -p1 --forward --batch < ../patches/KernelSU-Next-SUSFS-Patches.patch
          cd ..
          
          echo "Applying Core SUSFS 2.3.0..."
          patch -p1 --forward --batch < patches/SUSFS-DeInlined-v2.3.0.patch

      - name: Build KSUN + SUSFS + NoMount Kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          KSUN_VER=$(git -C KernelSU-Next rev-parse --short HEAD)
          NOMOUNT_VER=$(git -C NoMount rev-parse --short HEAD)
          
          echo "Generating KSUN + SUSFS + NoMount config..."
          make ARCH=arm64 O=out vendor/mt6768_defconfig
          cat arch/arm64/configs/vendor/selene.config >> out/.config
          
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> out/.config
          echo "CONFIG_NOMOUNT=y" >> out/.config
          
          echo "CONFIG_KSU_SUSFS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> out/.config
          echo "# CONFIG_KSU_SUSFS_ENABLE_LOG is not set" >> out/.config
          
          yes "" | make ARCH=arm64 O=out olddefconfig
          
          export LOCALVERSION="-Zyte-SUSFS-NoMount-${KSUN_VER}-${BUILD_DATE}"
          echo "Compiling ULTIMATE Kernel..."
          
          make ARCH=arm64 O=out -j$(nproc) CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LOCALVERSION="$LOCALVERSION"
          
          rm -f Zyte-Kernel/Image.gz* Zyte-Kernel/dtb
          cp out/arch/arm64/boot/Image.gz-dtb Zyte-Kernel/ || cp out/arch/arm64/boot/Image.gz Zyte-Kernel/
          cp out/arch/arm64/boot/dts/mediatek/mt6768.dtb Zyte-Kernel/dtb
          
          cd Zyte-Kernel
          zip -r9 "../releases/Zyte-Kernel-KernelSU-Next-SUSFS-NoMount-${KSUN_VER}-${BUILD_DATE}.zip" *
          cd ..

      # =====================================================================
      # UPLOAD & RELEASE
      # =====================================================================
      - name: Upload Artifacts to Action
        uses: actions/upload-artifact@v4
        with:
          name: Zyte-Kernel-Builds-${{ env.BUILD_DATE }}
          path: releases/*.zip
          if-no-files-found: error

      - name: Publish All to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zyte-kernel-build-${{ env.BUILD_DATE }}
          name: Zyte Kernel Build - ${{ env.BUILD_DATE }}
          body: |
            Automated build for **Zyte Kernel (Redmi 10 / selene)**.
            
            **Date**: `${{ env.BUILD_DATE }}`
            **Source Commit**: `${{ github.sha }}`
            
            ### Included Variants:
            * **Base**: Pure kernel, no root.
            * **KernelSU Next**: Includes KernelSU-Next with manual hooks.
            * **KernelSU Next + SUSFS**: Includes KernelSU-Next and SUSFS 2.3.0.
            * **KernelSU Next + NoMount**: Includes KernelSU-Next and NoMount VFS hiding.
            * **KernelSU Next + SUSFS + NoMount**: The ultimate hiding setup.
            
            Flash the `.zip` via a custom recovery (TWRP/OrangeFox).
          files: releases/*.zip
          draft: false
          prerelease: false
